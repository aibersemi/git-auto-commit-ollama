title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for asking the `git-auto-commit-ollama` community.
        Complete the form below so the community can provide an accurate answer.
  - type: textarea
    id: question
    attributes:
      label: What would you like to ask?
      description: Describe your question in detail.
      placeholder: "Example: How do I change the default model from Gemma to Llama 3?"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: OS and Ollama Versions
      description: Provide your OS (for example, Ubuntu 22.04) and Ollama version when relevant.
    validations:
      required: false
