title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for improving `git-auto-commit-ollama`?
        We would love to hear it. Share your thoughts below.
  - type: textarea
    id: idea
    attributes:
      label: Describe Your Idea
      description: Explain the feature or improvement you have in mind.
      placeholder: "Example: I would like an option that automatically adds an emoji to every commit message..."
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this important?
      description: How would this feature or idea help you or the wider community?
    validations:
      required: true
