name: "✨ Feature Request"
description: Suggest a new feature or an improvement to an existing feature
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - aibersemi
body:
  - type: markdown
    attributes:
      value: |
        We are always looking for ways to improve this tool. Share your feature idea below.
  - type: textarea
    id: problem
    attributes:
      label: Is this feature related to a problem?
      description: Describe the problem that motivated this request.
      placeholder: "Example: I am often frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution or feature you want
      description: Describe the feature you have in mind in detail.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives You Have Tried (Optional)
      description: Describe any other approaches you have used to work around the problem.
    validations:
      required: false
