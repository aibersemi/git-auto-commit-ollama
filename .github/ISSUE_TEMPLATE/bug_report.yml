name: "🐛 Bug Report"
description: Report a bug or error in git-auto-commit-ollama
title: "[Bug]: "
labels: ["bug"]
assignees:
  - aibersemi
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please complete the form below with as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly and concisely describe the bug you encountered while using git-ai.sh.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: List the detailed steps needed to reproduce the bug.
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Example: Ubuntu 22.04 LTS"
    validations:
      required: true
  - type: input
    id: ollama_version
    attributes:
      label: Ollama Version
      placeholder: "Example: 0.1.28 (run 'ollama --version' to check)"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error Output or Logs (Optional)
      description: Paste the relevant terminal error output here after removing sensitive data.
      render: shell
    validations:
      required: false
