name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  bash:
    name: Bash validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq

      - name: Install validated actionlint release
        run: |
          archive_path="${RUNNER_TEMP}/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive_path" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$archive_path" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/actionlint-bin"
          tar -xzf "$archive_path" -C "${RUNNER_TEMP}/actionlint-bin" actionlint
          echo "${RUNNER_TEMP}/actionlint-bin" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        run: actionlint

      - name: Install validated Gitleaks release
        run: |
          archive_path="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive_path" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive_path" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "$archive_path" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Check Bash syntax
        run: bash -n git-ai.sh

      - name: Run ShellCheck
        run: shellcheck git-ai.sh

      - name: Check help output
        run: ./git-ai.sh --help >/tmp/git-ai-help.txt

      - name: Validate Markdown reference tests
        run: |
          bash -n tests/markdown-references.sh
          shellcheck tests/markdown-references.sh

      - name: Test Markdown commit references
        run: bash tests/markdown-references.sh

      - name: Validate secret scanning tests
        run: |
          bash -n tests/secret-scanning.sh
          shellcheck tests/secret-scanning.sh

      - name: Test secret scanning and safe previews
        run: bash tests/secret-scanning.sh

      - name: Validate real Gitleaks integration tests
        run: |
          bash -n tests/gitleaks-integration.sh
          shellcheck tests/gitleaks-integration.sh

      - name: Test real Gitleaks staged scans
        run: bash tests/gitleaks-integration.sh
