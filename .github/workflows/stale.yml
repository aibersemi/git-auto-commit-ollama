name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '30 1 * * *'

permissions: {}

concurrency:
  group: stale-maintenance
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: 'This issue has been marked stale because it has had no activity for 60 days. If the problem is still relevant, please leave a comment. Otherwise, the issue will be closed in 7 days.'
          stale-pr-message: 'This pull request has been marked stale because it has had no updates for 60 days. Please provide an update when ready; it will remain open for maintainer review.'
          days-before-stale: 60
          days-before-close: 7
          days-before-pr-close: -1
          exempt-issue-labels: 'bug,enhancement,security'
          exempt-pr-labels: 'bug,enhancement,security'
          exempt-draft-pr: true
