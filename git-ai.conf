# git-ai.conf - Git AI Commit Assistant configuration
# -------------------------------------------------
# This file lives next to git-ai.sh and is the primary source of runtime
# defaults. Do not store secrets here.

# Ollama model and host used by the application.
DEFAULT_MODEL="gemma4:e4b"
DEFAULT_OLLAMA_HOST="http://127.0.0.1:11434"

# Example fallback host for an internal network.
# Replace or clear it when no fallback Ollama endpoint is used.
FALLBACK_OLLAMA_HOST="http://10.50.0.2:11434"

# Application commit message generation options
DEFAULT_DO_PUSH="1"
AI_TEMPERATURE="0.2"
AI_THINK="false"
AI_NUM_PREDICT="512"
AI_MAX_NUM_PREDICT="2048"
USE_STRUCTURED_OUTPUT="0"
MAX_COMMIT_MESSAGE_LENGTH="65536"

# Per-file analysis
FILE_ANALYSIS_LIMIT="6"
# "auto" detects OLLAMA_NUM_PARALLEL for a local systemd service. Use a
# positive integer to override detection.
FILE_ANALYSIS_PARALLELISM="auto"
FILE_ANALYSIS_BATCH_SIZE="6"
FILE_ANALYSIS_NUM_PREDICT_PER_FILE="192"
FILE_ANALYSIS_MAX_BLOB_BYTES="1048576"

# Local non-AI work uses at most this many concurrent workers. "auto" uses
# the logical CPU capacity available to the current process.
NON_AI_PARALLELISM="auto"

# Optional positive-integer capacity hint for remote, containerized, or
# otherwise non-detectable Ollama servers. Leave empty for local detection.
OLLAMA_PARALLELISM_HINT=""

# Prompt and context tuning
MAX_FILES_LIST="20"
TOP_FILES="4"
MAX_HUNK_CHARS="1000"
MAX_TOTAL_HUNKS_CHARS="3500"
